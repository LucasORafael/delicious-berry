<!-- Espaço para o header fixo -->

  style="padding-top: 80px;"
>
  <div
    id="filmesCarousel"
    class="carousel slide w-100"
    data-bs-ride="carousel"
    data-bs-interval="5000"  
  >
    <div class="carousel-inner">

      <!-- Slide 1 -->
      <div class="carousel-item active">
        <div class="row justify-content-center g-4">

          <div class="col-6 col-md-3">
            <a href="pages/page1.html" class="text-decoration-none text-dark">
              <div class="card">
                <img src="Images/silvio.png" class="card-img-top" alt="Filme 1" />
                <div class="card-body p-2">

                </div>

            </a>
          </div>

          <div class="col-6 col-md-3">

            <a href="pages/page3.html" class="text-decoration-none text-dark">

                <img src="Images/chico.png" class="card-img-top" alt="Filme 3" />

            </a>

          <div class="col-6 col-md-3">
            <a href="pages/page4.html" class="text-decoration-none text-dark">
              <div class="card">
                <img src="Images/dbz.png" class="card-img-top" alt="Filme 4" />
                <div class="card-body p-2">
                  <h6 class="card-title text-center mb-0">Dragon Ball Super: Super hero</h6>
                </div>

            </a>
          </div>
        </div>
      </div>

      <!-- Slide 2 -->

          <div class="col-6 col-md-3">
            <a href="pages/page5.html" class="text-decoration-none text-dark">
              <div class="card">
                <img src="Images/shrek2.png" class="card-img-top" alt="Filme 5" />
                <div class="card-body p-2">

                </div>
              </div>
            </a>
          </div>

          <div class="col-6 col-md-3">
            <a href="pages/page6.html" class="text-decoration-none text-dark">
              <div class="card">
                <img src="Images/matrix.png" class="card-img-top" alt="Filme 6" />
                <div class="card-body p-2">
                  <h6 class="card-title text-center mb-0">Matrix</h6>
                </div>

          <div class="col-6 col-md-3">
            <a href="pages/page7.html" class="text-decoration-none text-dark">

    </div>

  
    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#filmesCarousel"
      data-bs-slide="prev"
      aria-label="Anterior"
    >
      <span class="carousel-control-prev-icon"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#filmesCarousel"
      data-bs-slide="next"
      aria-label="Próximo"
    >
      <span class="carousel-control-next-icon"></span>
      <span class="visually-hidden">Próximo</span>
    </button>
