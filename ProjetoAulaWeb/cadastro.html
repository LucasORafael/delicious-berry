<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formulário de Cadastro</title>

 
  <link rel="stylesheet" href="css/bootstrap.min.css" />
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">

  <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
    <h2 class="text-center mb-4">Formulário de Cadastro</h2>

    <form method="post" action="crud1/inserir.php">
      <div class="mb-3">
        <input type="text" class="form-control" name="nome" placeholder="Digite seu nome" required />
      </div>

      <div class="mb-3">
        <input type="number" class="form-control" name="telefone" placeholder="(00) 0000-0000" required />
      </div>

      <div class="mb-3">
        <input type="email" class="form-control" name="email" placeholder="nome@exemplo.com.br" required />
      </div>

      <div class="mb-3">
        <input type="password" class="form-control" name="senha" placeholder="Digite sua senha" required />
      </div>

      <div class="d-grid mb-2">
        <button type="submit" class="btn btn-primary">Enviar</button>
      </div>

      <div class="d-grid">
        <a href="main.html" class="btn btn-secondary">Voltar para Home</a>
      </div>
    </form>
  </div>


  <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
