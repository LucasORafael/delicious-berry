<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teste</title>

  <!-- Bootstrap 5 CSS local -->
  <link rel="stylesheet" href="css/bootstrap.min.css" />
</head>
<body class="d-flex justify-content-center align-items-center vh-100 text-center">

  <form class="w-100" style="max-width: 330px;" action="#" method="POST" novalidate>
    <img
      class="mb-4"
      src="Images/logo-removebg-preview__1_-removebg-preview.png"
      alt="Bootstrap Logo"
      width="72"
      height="72"
    />
    <h1 class="h3 mb-3 fw-normal">Faça login</h1>

    <div class="form-floating mb-2">
      <input
        type="email"
        class="form-control"
        id="inputEmail"
        name="email"
        placeholder="Seu email"
        required
        autofocus
      />
      <label for="inputEmail">Endereço de email</label>
    </div>

    <div class="form-floating mb-3">
      <input
        type="password"
        class="form-control"
        id="inputPassword"
        name="password"
        placeholder="Senha"
        required
      />
      <label for="inputPassword">Senha</label>
    </div>

    <div class="form-check text-start mb-3">
      <input
        class="form-check-input"
        type="checkbox"
        value=""
        id="rememberCheck"
        name="remember"
      />
      <label class="form-check-label" for="rememberCheck">Lembrar de mim</label>
    </div>

    <button class="btn btn-lg btn-primary w-100" type="submit">
      Login
    </button>

    <p class="mt-5 mb-3 text-muted">&copy; bpp - 2026</p>
  </form>

    <script src="js/jquery-3.3.1.slim.min.js" ></script>
    <script src="js/popper.min.js"  ></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
