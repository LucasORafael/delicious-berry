<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro de Filme</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">

  <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
    <h2 class="text-center mb-4">Cadastro de Filme</h2>

    <form method="post" action="crud2/inserirfilme.php">
      <div class="mb-3">
        <input type="text" class="form-control" name="nome" placeholder="Nome do Filme" required />
      </div>

      <div class="mb-3">
        <input type="text" class="form-control" name="classificacao" placeholder="Classificação (ex: L, 12)" required />
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-danger rounded-pill shadow-sm">Cadastrar Filme</button>
        <a href="main.html" class="btn btn-secondary rounded-pill">Voltar para Home</a>
      </div>
    </form>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
